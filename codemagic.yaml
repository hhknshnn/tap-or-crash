workflows:
  unity-ios-test:
    name: Unity iOS Export Test

    instance_type: mac_mini_m2

    max_build_duration: 60

    environment:
      vars:
        UNITY_VERSION: 6000.4.0f1
        UNITY_CHANGESET: 8cf496087c8f
        UNITY_IOS_EXPORT_PATH: build/ios

    scripts:
      - name: Show environment
        script: |
          set -e
          sw_vers
          uname -m
          pwd
          ls -la
          cat ProjectSettings/ProjectVersion.txt

      - name: Install Unity
        script: |
          set -e

          /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub \
            -- --headless install \
            --version "$UNITY_VERSION" \
            --changeset "$UNITY_CHANGESET"

          /Applications/Unity\ Hub.app/Contents/MacOS/Unity\ Hub \
            -- --headless install-modules \
            --version "$UNITY_VERSION" \
            -m ios

      - name: Locate Unity
        script: |
          set -e

          UNITY_PATH="/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"

          if [ ! -x "$UNITY_PATH" ]; then
            echo "Unity çalıştırılabilir dosyası bulunamadı:"
            echo "$UNITY_PATH"
            exit 1
          fi

          echo "Unity bulundu:"
          echo "$UNITY_PATH"

      - name: Export iOS project
        script: |
          set -e

          UNITY_PATH="/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"

          "$UNITY_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$CM_BUILD_DIR" \
            -executeMethod BuildScript.BuildIos \
            -logFile "$CM_BUILD_DIR/unity-ios-build.log" || {
              cat "$CM_BUILD_DIR/unity-ios-build.log"
              exit 1
            }

          cat "$CM_BUILD_DIR/unity-ios-build.log"

    artifacts:
      - build/ios/**
      - unity-ios-build.log