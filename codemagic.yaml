workflows:
  unity-ios-test:
    name: Unity iOS Export Test

    instance_type: mac_mini_m2
    max_build_duration: 60

    environment:
      vars:
        UNITY_VERSION: 6000.4.0f1
        UNITY_CHANGESET: 8cf496087c8f
        UNITY_IOS_EXPORT_PATH: build/ios

    scripts:
      - name: Show environment
        script: |
          set -e

          echo "macOS:"
          sw_vers

          echo "Architecture:"
          uname -m

          echo "Project directory:"
          pwd

          echo "Unity project version:"
          cat ProjectSettings/ProjectVersion.txt

      - name: Install Unity and iOS module
        script: |
          set -e

          HUB="/Applications/Unity Hub.app/Contents/MacOS/Unity Hub"

          if [ ! -x "$HUB" ]; then
            echo "Unity Hub bulunamadı:"
            echo "$HUB"
            exit 1
          fi

          echo "Unity $UNITY_VERSION Apple Silicon sürümü kuruluyor..."

          "$HUB" -- --headless install \
            --version "$UNITY_VERSION" \
            --changeset "$UNITY_CHANGESET" \
            --architecture arm64 \
            --module ios

      - name: Locate Unity
        script: |
          set -e

          UNITY_PATH="/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"

          if [ ! -x "$UNITY_PATH" ]; then
            echo "Unity çalıştırılabilir dosyası bulunamadı:"
            echo "$UNITY_PATH"

            echo "Kurulu Editor klasörleri:"
            find "/Applications/Unity/Hub/Editor" -maxdepth 2 -type d 2>/dev/null || true

            exit 1
          fi

          echo "Unity bulundu:"
          echo "$UNITY_PATH"

          "$UNITY_PATH" -version

      - name: Export iOS project
        script: |
          set -e

          UNITY_PATH="/Applications/Unity/Hub/Editor/$UNITY_VERSION/Unity.app/Contents/MacOS/Unity"
          BUILD_LOG="$CM_BUILD_DIR/unity-ios-build.log"

          set +e

          "$UNITY_PATH" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$CM_BUILD_DIR" \
            -executeMethod BuildScript.BuildIos \
            -logFile "$BUILD_LOG"

          UNITY_EXIT_CODE=$?

          set -e

          if [ -f "$BUILD_LOG" ]; then
            cat "$BUILD_LOG"
          fi

          if [ "$UNITY_EXIT_CODE" -ne 0 ]; then
            echo "Unity iOS export başarısız oldu."
            echo "Unity exit code: $UNITY_EXIT_CODE"
            exit "$UNITY_EXIT_CODE"
          fi

          if [ ! -d "$CM_BUILD_DIR/build/ios" ]; then
            echo "Unity başarılı çıkış verdi ancak build/ios klasörü oluşmadı."
            exit 1
          fi

          echo "Unity iOS export tamamlandı."

    artifacts:
      - build/ios/**
      - unity-ios-build.log